services:

  hep-web:
    build: .
    image: hep_ha:latest
    container_name: hep-energy-web
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/hep_energy.db
    volumes:
      - hep-data:/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  hep-sync:
    image: hep_ha:latest
    container_name: hep-energy-sync
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/hep_energy.db
    volumes:
      - hep-data:/data
    command: ["/bin/sh", "/app/sync_loop.sh"]
    healthcheck:
      disable: true
    depends_on:
      hep-web:
        condition: service_started

volumes:
  hep-data:
    driver: local
