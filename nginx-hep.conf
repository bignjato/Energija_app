# nginx konfiguracija za hep.infobot.cc
# Kopirajte u: /etc/nginx/sites-available/hep.infobot.cc
# Ako koristite Traefik, ova datoteka vam ne treba.

server {
    listen 80;
    server_name hep.infobot.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hep.infobot.cc;

    # SSL (prilagodite putanje)
    ssl_certificate     /etc/letsencrypt/live/hep.infobot.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hep.infobot.cc/privkey.pem;

    # Proxy prema Flask kontejneru
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Cache za statičke resurse
    location ~* \.(js|css|png|ico)$ {
        proxy_pass http://127.0.0.1:5000;
        expires 1h;
        add_header Cache-Control "public";
    }
}
