# Primjer Secreta — KOPIRAJ u secret.yaml, popuni i NE commitaj.
#   cp secret.example.yaml secret.yaml && $EDITOR secret.yaml
# secret.yaml je u .gitignore.
#
# SECRET_KEY generiraj: python3 -c "import secrets; print(secrets.token_hex(32))"
apiVersion: v1
kind: Secret
metadata:
  name: hep-energy-env
  namespace: hep-energy
type: Opaque
stringData:
  SECRET_KEY: ""                 # OBAVEZNO, ≥32 hex znakova
  INITIAL_ADMIN_PASSWORD: "admin"

  HEP_USERNAME: ""
  HEP_PASSWORD: ""
  HEP_SIFRA: ""

  # SMA (Monitoring API preporučen)
  SMA_USE_API: "false"
  SMA_API_CLIENT_ID: ""
  SMA_API_CLIENT_SECRET: ""
  SMA_API_REFRESH_TOKEN: ""
  SMA_API_PLANT_ID: ""

  # Home Assistant (opcionalno)
  HA_URL: ""
  HA_TOKEN: ""
  HA_VERIFY_SSL: "1"             # 0 za self-signed cert
  # HA_NOTIFY_SERVICE: "notify/persistent_notification"

  # Tarife
  TARIFA_VT: "0.131205"
  TARIFA_NT: "0.064379"
  TARIFA_PROD: "0.064379"
  TARIFA_PDV: "13"
  TARIFA_VT_OD: "7"
  TARIFA_VT_DO: "21"

  # Alerti
  ANOMALY_THRESHOLD_PERC: "50"

  # Off-site backup (opcionalno)
  OFFSITE_BACKUP_MODE: "disabled"
  OFFSITE_BACKUP_DEST: ""
  OFFSITE_BACKUP_KEEP: "30"
