# nginx — primjer konfiguracije za HEP Energy Monitor
#
# Kopiraj u /etc/nginx/sites-available/<tvoja-domena>:
#   sudo cp nginx-example.conf /etc/nginx/sites-available/energija
#   sudo ln -s /etc/nginx/sites-available/energija /etc/nginx/sites-enabled/
#
# Prvo nabavi Let's Encrypt cert:
#   sudo certbot --nginx -d energija.example.com
#
# Zamijeni `energija.example.com` svojom domenom.

server {
    server_name energija.example.com;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy — ZAKOMENTIRANO: prvo testiraj (npr. kao
    # Content-Security-Policy-Report-Only i gledaj konzolu preglednika) pa tek onda uključi.
    # Dashboard učitava Chart.js s cdn.jsdelivr.net i fontove s Google Fonts, a
    # koristi inline <script>/<style> i onclick/style atribute → 'unsafe-inline'.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # App prima PDF račune do 5 MB; nginx default je 1 MB (→ 413)
    client_max_body_size 6m;

    location / {
        # port 5000 je objavljen samo na loopbacku (vidi docker-compose.yml)
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;   # malo iznad gunicorn --timeout 120
        proxy_buffering off;
        proxy_cookie_path / "/; SameSite=Lax; Secure";
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/energija.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/energija.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = energija.example.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name energija.example.com;
    return 404;
}
